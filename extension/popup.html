<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#1e1f22; --panel:#2b2d31; --text:#e8e8ea; --dim:#9a9ca3; --on:#4f8cff; --off:#555861; }
  * { box-sizing: border-box; }
  body { margin:0; width:260px; background:var(--bg); color:var(--text);
         font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding:10px 14px; font-weight:600; background:var(--panel); display:flex; justify-content:space-between; align-items:center; }
  header small { color:var(--dim); font-weight:400; }
  .main { padding:18px 14px 12px; text-align:center; }
  #power { width:96px; height:96px; border-radius:50%; border:none; cursor:pointer;
           background:var(--on); color:#fff; display:grid; place-items:center; margin:0 auto;
           transition: background .15s, transform .1s; }
  #power:active { transform: scale(.96); }
  #power.off { background:var(--off); }
  #power:disabled { cursor:not-allowed; opacity:.5; }
  #power svg { width:46px; height:46px; }
  #site { margin-top:12px; font-weight:600; word-break:break-all; }
  #status { color:var(--dim); margin-top:2px; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-top:1px solid #3a3c42; }
  .switch { position:relative; width:38px; height:22px; flex:none; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; inset:0; background:var(--off); border-radius:22px; cursor:pointer; transition:.15s; }
  .slider:before { content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; }
  input:checked + .slider { background:var(--on); }
  input:checked + .slider:before { transform: translateX(16px); }
  details { border-top:1px solid #3a3c42; padding:8px 14px 10px; }
  summary { cursor:pointer; color:var(--dim); }
  ul { list-style:none; margin:6px 0 0; padding:0; max-height:120px; overflow:auto; }
  li { display:flex; justify-content:space-between; align-items:center; padding:3px 0; word-break:break-all; }
  li button { background:none; border:none; color:var(--dim); cursor:pointer; font-size:14px; }
  li button:hover { color:#ff6b6b; }
  .empty { color:var(--dim); font-style:italic; }
</style>
</head>
<body>
  <header>CastGuard <small>v1.0</small></header>
  <div class="main">
    <button id="power" title="Toggle for this site">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <path d="M12 3v9"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/>
      </svg>
    </button>
    <div id="site">...</div>
    <div id="status"></div>
  </div>
  <div class="row">
    <span>Protect all sites</span>
    <label class="switch"><input type="checkbox" id="global"><span class="slider"></span></label>
  </div>
  <details>
    <summary>Turned off on (<span id="count">0</span>)</summary>
    <ul id="list"></ul>
  </details>
  <script src="popup.js"></script>
</body>
</html>
